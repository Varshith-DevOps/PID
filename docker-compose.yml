# PID HCMS Production Docker Compose Configuration
# Backend connects to its dedicated PostgreSQL database service (hrms_postgres).
version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: hrms_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: hrms
      POSTGRES_PASSWORD: hrms
      POSTGRES_DB: hrms
    ports:
      - "5432:5432"
    volumes:
      - hrms_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hrms -d hrms"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: hrms_backend
    restart: unless-stopped
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://hrms:hrms@db:5432/hrms?schema=public
      DIRECT_URL: postgresql://hrms:hrms@db:5432/hrms?schema=public
      JWT_SECRET: "DuxLsbL0OhdVoVMKI9ixN7lmbaabdBlsHiaPxqvOmSAUnm7JtmkNjIcolf6YUEhS"
      JWT_EXPIRES_IN: 7d
      PORT: 5000
      AI_RECRUITMENT_SERVICE_URL: http://ai-recruitment-service:8001
      AI_RECRUITMENT_SERVICE_TOKEN: "-VJ7Q62wE0OzZF91T1QFLtK7Iyxmb0YT6FnMeRfH1lf8YbXqlWgsydg45I3VJNp2"
      HRMS_SERVICE_TOKEN: "-VJ7Q62wE0OzZF91T1QFLtK7Iyxmb0YT6FnMeRfH1lf8YbXqlWgsydg45I3VJNp2"
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "node scripts/make-postgres-schema.js && npx prisma db push --schema=prisma/schema.postgres.prisma && node scripts/verify-all-7-accounts.js && node src/index.js"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:5000/health/live',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: .
      dockerfile: ./frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://13.232.70.236:5000/api
    container_name: hrms_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend

  ai-recruitment-service:
    build:
      context: ./ai-recruitment-service
    container_name: hrms_ai_recruitment_service
    restart: unless-stopped
    environment:
      APP_ENV: production
      PORT: 8001
      HRMS_API_URL: http://backend:5000/api
      HRMS_SERVICE_TOKEN: "-VJ7Q62wE0OzZF91T1QFLtK7Iyxmb0YT6FnMeRfH1lf8YbXqlWgsydg45I3VJNp2"
      AI_DATABASE_URL: ${AI_DATABASE_URL:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-disabled}
      LLM_MODEL: ${LLM_MODEL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY:-}
      AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT:-}
      AZURE_OPENAI_API_VERSION: ${AZURE_OPENAI_API_VERSION:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://localhost:11434}
      MAX_RESUME_SIZE_MB: 10
      HRMS_REQUEST_TIMEOUT_SECONDS: 30
      LLM_REQUEST_TIMEOUT_SECONDS: 60
      PII_LOGGING_ENABLED: "false"
    expose:
      - "8001"
    tmpfs:
      - /tmp/ai-recruitment
    read_only: true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  hrms_pgdata:
