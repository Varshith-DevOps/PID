# Local/staging PostgreSQL for the HRMS backend.
# SQLite remains the default for quick local dev; use this to run the app against
# PostgreSQL (the supported production database) before cutover.
#
#   docker compose up -d db
#   # in backend/.env set:
#   #   DATABASE_URL="postgresql://hrms:hrms@localhost:5432/hrms?schema=public"
#   # then follow docs/07_PostgreSQL_Migration_Runbook.md
version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: hrms_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: hrms
      POSTGRES_PASSWORD: hrms
      POSTGRES_DB: hrms
    ports:
      - "5432:5432"
    volumes:
      - hrms_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hrms -d hrms"]
      interval: 10s
      timeout: 5s
      retries: 5

  ai-recruitment-service:
    build:
      context: ./ai-recruitment-service
    container_name: hrms_ai_recruitment_service
    restart: unless-stopped
    environment:
      APP_ENV: production
      PORT: 8001
      HRMS_API_URL: http://backend:5000/api
      HRMS_SERVICE_TOKEN: ${HRMS_SERVICE_TOKEN:-}
      AI_DATABASE_URL: ${AI_DATABASE_URL:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-disabled}
      LLM_MODEL: ${LLM_MODEL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY:-}
      AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT:-}
      AZURE_OPENAI_API_VERSION: ${AZURE_OPENAI_API_VERSION:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://localhost:11434}
      MAX_RESUME_SIZE_MB: 10
      HRMS_REQUEST_TIMEOUT_SECONDS: 30
      LLM_REQUEST_TIMEOUT_SECONDS: 60
      PII_LOGGING_ENABLED: "false"
    expose:
      - "8001"
    tmpfs:
      - /tmp/ai-recruitment
    read_only: true
    profiles:
      - ai
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  hrms_pgdata:
